<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Engineering App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <main>
    <header class="page-header">
      <h1>Task Board</h1>
      <p>// Gestión de tareas del equipo de ingeniería</p>
    </header>

    <!-- TASK FORM — feature/task-form -->
    <section class="task-form">
      <h2>+ Nueva Tarea</h2>
      <form id="task-form">
        <div class="form-row">
          <div class="form-group full">
            <label for="task-title">Título *</label>
            <input id="task-title" type="text" placeholder="Ej. Implementar autenticación JWT" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label for="task-desc">Descripción</label>
            <textarea id="task-desc" placeholder="Detalles opcionales de la tarea…"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Prioridad</label>
            <select id="task-priority">
              <option value="high">🔴 Alta</option>
              <option value="medium" selected>🟡 Media</option>
              <option value="low">🟢 Baja</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-assignee">Asignado a</label>
            <input id="task-assignee" type="text" placeholder="Nombre del integrante" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Agregar Tarea</button>
        </div>
      </form>
    </section>

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="active">Pendientes</button>
      <button class="filter-btn" data-filter="done">Completadas</button>
    </div>

    <!-- TASK LIST -->
    <div id="task-list" class="task-list"></div>
  </main>

  <footer>
    <span>Task Engineering App &mdash; Equipo de Ingeniería &copy; 2025</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
